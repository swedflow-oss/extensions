name: Included runner policy

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  runner-policy:
    name: Included runner policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: audit
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install YAML parser
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m venv runner-policy-venv
          runner-policy-venv/bin/python -I -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check runner policy
        working-directory: ${{ runner.temp }}
        env:
          AUDIT_ROOT: ${{ github.workspace }}/audit
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: bash
        run: |
          runner-policy-venv/bin/python -I - <<'PY'
          """Inspect workflow data only; never execute code from the repository under review."""
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import yaml
          
          STANDARD = {
              'ubuntu-latest', 'ubuntu-slim', 'ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04',
              'ubuntu-22.04-arm', 'ubuntu-24.04-arm', 'ubuntu-26.04-arm',
              'windows-latest', 'windows-2022', 'windows-2025', 'windows-11-arm',
              'windows-11-vs2026-arm',
          }
          ORG_WORKFLOWS = {'pr-hygiene.yml', 'queue-report.yml', 'red-alert.yml', 'red-alert-clear.yml'}
          EXPR_OPEN = '$' + '{{'
          
          class PolicyError(ValueError):
              pass
          
          def atom(value):
              value = value.strip()
              if re.fullmatch(r"'(?:[^']|'')*'", value):
                  return value[1:-1].replace("''", "'")
              match = re.fullmatch(r"fromJSON\(('(?:[^']|'')*')\)", value, re.I)
              if match:
                  text = atom(match[1])
                  try:
                      return json.loads(text)
                  except json.JSONDecodeError:
                      # Older workflows unnecessarily escape double quotes inside single-quoted expressions.
                      return json.loads(text.replace('\\"', '"'))
              raise PolicyError('Runner expression must have literal, verifiably safe outcomes')
          
          def outcomes(value, job):
              if not isinstance(value, str) or EXPR_OPEN not in value:
                  return [value]
              match = re.fullmatch(r'\s*\$\{\{\s*(.*?)\s*\}\}\s*', value)
              if not match:
                  raise PolicyError('Interpolated runner labels cannot be verified')
              expression = match[1]
              axis = re.fullmatch(r'matrix\.([A-Za-z_][A-Za-z0-9_]*)', expression)
              if axis:
                  matrix = job.get('strategy', {}).get('matrix', {})
                  if not isinstance(matrix, dict):
                      raise PolicyError('Runner matrices must declare literal values')
                  values = matrix.get(axis[1], [])
                  if not isinstance(values, list):
                      raise PolicyError('Runner matrices must declare literal values')
                  values = values + [row[axis[1]] for row in matrix.get('include', []) if axis[1] in row]
                  if not values:
                      raise PolicyError('Runner matrix has no verifiable values')
                  return [item for value in values for item in outcomes(value, {})]
              conditional = re.fullmatch(
                  r"(?:vars|inputs)\.[A-Za-z_][A-Za-z0-9_]*\s*(?:==|!=)\s*'(?:[^']|'')*'\s*&&\s*(.*?)\s*\|\|\s*(.*)",
                  expression,
              )
              if conditional:
                  # Check BOTH outcomes, independent of current input/variable values.
                  return [atom(conditional[1]), atom(conditional[2])]
              return [atom(expression)]
          
          def safe_runner(value):
              if isinstance(value, dict):
                  # Hosted larger-runner groups are forbidden; explicit self-hosted labels are required.
                  value = value.get('labels')
                  if not isinstance(value, list) or 'self-hosted' not in value:
                      raise PolicyError('Runner groups must explicitly select self-hosted runners')
              if isinstance(value, list):
                  if not value or any(not isinstance(x, str) or EXPR_OPEN in x for x in value):
                      raise PolicyError('Runner labels must be literal strings')
                  if 'self-hosted' in value:
                      return
                  if len(value) == 1 and value[0] in STANDARD:
                      return
                  raise PolicyError('Use explicit self-hosted labels or one standard Linux/Windows label')
              if not isinstance(value, str) or value not in STANDARD:
                  raise PolicyError(f'Forbidden or unverified hosted runner: {value!r}')
          
          def read_workflow(root, relative):
              path = root / relative
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root.resolve()):
                  raise PolicyError(f'Workflow must be a regular file inside the repository: {relative}')
              if path.stat().st_size > 1_000_000:
                  raise PolicyError('Workflow exceeds the policy inspection size limit')
              data = yaml.safe_load(path.read_text())
              if not isinstance(data, dict) or not isinstance(data.get('jobs'), dict):
                  raise PolicyError('Workflow must declare a jobs mapping')
              return data
          
          def check_workflow(root, relative, visited=None):
              visited = set() if visited is None else visited
              if relative in visited:
                  return
              visited.add(relative)
              data = read_workflow(root, relative)
              for name, job in data['jobs'].items():
                  if not isinstance(job, dict):
                      raise PolicyError(f'{relative}:{name}: invalid job')
                  if 'runs-on' in job:
                      for value in outcomes(job['runs-on'], job):
                          safe_runner(value)
                  elif isinstance(job.get('uses'), str):
                      uses = job['uses']
                      if re.fullmatch(r'\./\.github/workflows/[^/]+\.ya?ml', uses):
                          check_workflow(root, uses[2:], visited)
                      elif re.fullmatch(r'gritflow/\.github/\.github/workflows/[^/@]+@main', uses) and uses.split('/')[-1].split('@')[0] in ORG_WORKFLOWS:
                          # These existing central workflows are covered by the same enterprise ruleset.
                          continue
                      else:
                          raise PolicyError(f'{relative}:{name}: reusable workflow needs a runner-policy review: {uses}')
                  else:
                      raise PolicyError(f'{relative}:{name}: missing runs-on or reusable workflow')
          
          def changed_workflows(root, base):
              if not re.fullmatch(r'[0-9a-fA-F]{40}', base):
                  raise PolicyError('A valid base commit is required; refusing to skip inspection')
              p = subprocess.run(['git', '-C', str(root), 'diff', '--name-only', '-z', '--diff-filter=ACMRT', base, 'HEAD', '--', '.github/workflows'], capture_output=True, check=True)
              return [name for name in p.stdout.decode().split('\0') if re.fullmatch(r'\.github/workflows/[^/]+\.ya?ml', name)]
          
          def main():
              root = Path(os.environ['AUDIT_ROOT']).resolve()
              names = changed_workflows(root, os.environ['BASE_SHA'])
              errors = []
              for name in names:
                  try:
                      check_workflow(root, name)
                  except (PolicyError, yaml.YAMLError, json.JSONDecodeError, OSError, TypeError, KeyError) as error:
                      errors.append(f'{name}: {error}')
              if errors:
                  for error in errors:
                      print(error, file=sys.stderr)
                  return 1
              print(f'Runner policy passed: {len(names)} new/modified workflow files checked. Hosted macOS, larger and unknown hosted runners are forbidden; explicit self-hosted runners are allowed.')
              return 0
          
          if __name__ == '__main__':
              sys.exit(main())
          PY
